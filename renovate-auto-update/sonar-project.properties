# This is removing blame from files generated from the test scripts.  These files are not checked into GIT
sonar.scm.disabled=true

sonar.sources=src
sonar.tests=src

sonar.test.inclusions=**/*.test.ts,**/*.spec.ts
sonar.inclusions=src/**/*.js,src/**/*.ts
sonar.exclusions=coverage/**,dist/**,node_modules/**,.vscode/**,src/**/*.d.ts,jest.config.ts,eslint.config.mjs,tsconfig.json

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.testExecutionReportPaths=coverage/sonar-unit-report.xml
